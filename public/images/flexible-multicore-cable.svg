<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9FAF8" />
      <stop offset="100%" stop-color="#EEF2EF" />
    </linearGradient>
    <linearGradient id="darkSheathGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="50%" stop-color="#1F2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="redCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <linearGradient id="blueCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="yellowCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#A16207" />
    </linearGradient>
    <linearGradient id="copperStrands" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#9A3412" />
    </linearGradient>
    <filter id="flexShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.14" />
    </filter>
  </defs>

  <rect width="600" height="450" fill="url(#cardBg)" rx="16" />

  <!-- Multi-core Flexible Cable Graphic -->
  <g transform="translate(80, 100)" filter="url(#flexShadow)">
    <!-- Curving black cable -->
    <path d="M 40,240 C 90,120 220,100 300,160 C 340,190 320,240 260,250 C 200,260 170,200 240,150 L 320,120" fill="none" stroke="url(#darkSheathGrad)" stroke-width="36" stroke-linecap="round" />

    <!-- Stripped Multi-Core Fan Out -->
    <g transform="translate(320, 120)">
      <!-- Sheath Cut -->
      <ellipse cx="0" cy="0" rx="14" ry="20" fill="#4B5563" />

      <!-- Core 1 (Red) -->
      <path d="M 0,-8 C 30,-25 60,-35 90,-40" fill="none" stroke="url(#redCore)" stroke-width="12" stroke-linecap="round" />
      <path d="M 90,-40 L 120,-45" fill="none" stroke="url(#copperStrands)" stroke-width="7" stroke-linecap="round" />

      <!-- Core 2 (Blue) -->
      <path d="M 0,0 C 35,0 70,0 100,5" fill="none" stroke="url(#blueCore)" stroke-width="12" stroke-linecap="round" />
      <path d="M 100,5 L 130,10" fill="none" stroke="url(#copperStrands)" stroke-width="7" stroke-linecap="round" />

      <!-- Core 3 (Yellow/Green) -->
      <path d="M 0,8 C 30,25 60,35 90,40" fill="none" stroke="url(#yellowCore)" stroke-width="12" stroke-linecap="round" />
      <path d="M 90,40 L 120,45" fill="none" stroke="url(#copperStrands)" stroke-width="7" stroke-linecap="round" />
    </g>
  </g>

  <!-- Spec Tag -->
  <g transform="translate(40, 40)">
    <rect width="140" height="34" rx="8" fill="#167346" />
    <text x="70" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">MULTI-CORE FLEX</text>
  </g>
  <g transform="translate(430, 40)">
    <rect width="130" height="34" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" />
    <text x="495" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#202522" text-anchor="middle">FINE COPPER</text>
  </g>
</svg>

