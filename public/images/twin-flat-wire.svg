<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9FAF8" />
      <stop offset="100%" stop-color="#EEF2EF" />
    </linearGradient>
    <linearGradient id="whiteSheathGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="redCoreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <linearGradient id="blackCoreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4B5563" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="copperStrands" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#9A3412" />
    </linearGradient>
    <filter id="flatShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="600" height="450" fill="url(#cardBg)" rx="16" />

  <!-- Flat Cable Coil & Cutaway -->
  <g transform="translate(100, 120)" filter="url(#flatShadow)">
    <!-- Flat Cable Curve -->
    <path d="M 50,220 C 120,100 280,100 350,170 C 400,220 380,260 300,260 C 220,260 160,200 240,160" fill="none" stroke="url(#whiteSheathGrad)" stroke-width="44" stroke-linecap="round" />

    <!-- Stripped End Section -->
    <g transform="translate(240, 160)">
      <!-- Sheath Cut Lip -->
      <ellipse cx="0" cy="0" rx="16" ry="24" fill="#CBD5E1" />
      
      <!-- Core 1 (Red) -->
      <path d="M 0,-8 Q 40,-12 80,-10" fill="none" stroke="url(#redCoreGrad)" stroke-width="14" stroke-linecap="round" />
      <!-- Copper Tip Red -->
      <path d="M 80,-10 L 110,-10" fill="none" stroke="url(#copperStrands)" stroke-width="8" stroke-linecap="round" />

      <!-- Core 2 (Black) -->
      <path d="M 0,8 Q 40,12 80,10" fill="none" stroke="url(#blackCoreGrad)" stroke-width="14" stroke-linecap="round" />
      <!-- Copper Tip Black -->
      <path d="M 80,10 L 110,10" fill="none" stroke="url(#copperStrands)" stroke-width="8" stroke-linecap="round" />
    </g>
  </g>

  <!-- Spec Tag -->
  <g transform="translate(40, 40)">
    <rect width="130" height="34" rx="8" fill="#167346" />
    <text x="65" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2-CORE FLAT</text>
  </g>
  <g transform="translate(430, 40)">
    <rect width="130" height="34" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" />
    <text x="495" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#202522" text-anchor="middle">300 / 500 V</text>
  </g>
</svg>

