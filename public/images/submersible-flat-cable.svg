<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9FAF8" />
      <stop offset="100%" stop-color="#EEF2EF" />
    </linearGradient>
    <linearGradient id="blueJacketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="coreRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <linearGradient id="coreYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#A16207" />
    </linearGradient>
    <linearGradient id="coreBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <linearGradient id="copperStrands" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#9A3412" />
    </linearGradient>
    <filter id="subShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.14" />
    </filter>
  </defs>

  <rect width="600" height="450" fill="url(#cardBg)" rx="16" />

  <!-- Submersible Flat Blue Cable -->
  <g transform="translate(90, 110)" filter="url(#subShadow)">
    <!-- 3-Rib Flat Cable Outline -->
    <path d="M 40,240 C 100,140 220,110 320,160 C 370,185 360,230 300,240 C 230,250 180,180 260,140 L 330,110" fill="none" stroke="url(#blueJacketGrad)" stroke-width="48" stroke-linecap="round" />

    <!-- Stripped 3 Flat Cores -->
    <g transform="translate(330, 110)">
      <ellipse cx="0" cy="0" rx="16" ry="26" fill="#1E40AF" />

      <!-- Top Core (Red) -->
      <path d="M 0,-14 Q 40,-20 80,-20" fill="none" stroke="url(#coreRed)" stroke-width="12" stroke-linecap="round" />
      <path d="M 80,-20 L 110,-20" fill="none" stroke="url(#copperStrands)" stroke-width="7" stroke-linecap="round" />

      <!-- Mid Core (Yellow) -->
      <path d="M 0,0 Q 40,0 80,0" fill="none" stroke="url(#coreYellow)" stroke-width="12" stroke-linecap="round" />
      <path d="M 80,0 L 110,0" fill="none" stroke="url(#copperStrands)" stroke-width="7" stroke-linecap="round" />

      <!-- Bottom Core (Blue) -->
      <path d="M 0,14 Q 40,20 80,20" fill="none" stroke="url(#coreBlue)" stroke-width="12" stroke-linecap="round" />
      <path d="M 80,20 L 110,20" fill="none" stroke="url(#copperStrands)" stroke-width="7" stroke-linecap="round" />
    </g>
  </g>

  <!-- Spec Tag -->
  <g transform="translate(40, 40)">
    <rect width="145" height="34" rx="8" fill="#167346" />
    <text x="72" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">SUBMERSIBLE 3-CORE</text>
  </g>
  <g transform="translate(430, 40)">
    <rect width="130" height="34" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" />
    <text x="495" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#202522" text-anchor="middle">WATERPROOF</text>
  </g>
</svg>

